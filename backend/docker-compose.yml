services:
  postgres:
    image: postgres:16-alpine
    container_name: iplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2470708
      POSTGRES_DB: iplatform
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      # named volume — данные переживут `docker compose down`, `restart` и т.д.
      - iplatform_pgdata:/var/lib/postgresql/data      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iplatform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  iplatform_pgdata:
    name: iplatform_pgdata